<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>システムチェック中...</title>
    <!-- Tailwind CSS (スタイリング用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Google Fonts 読み込み */
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans JP', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* 画面全体のシェイク（揺れ）アニメーション */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-8px, -8px) rotate(-1deg); }
            20% { transform: translate(8px, 5px) rotate(1deg); }
            30% { transform: translate(-6px, 6px) rotate(0deg); }
            40% { transform: translate(6px, -4px) rotate(1deg); }
            50% { transform: translate(-5px, 5px) rotate(-1deg); }
            60% { transform: translate(7px, -7px) rotate(0deg); }
            70% { transform: translate(-8px, 6px) rotate(1deg); }
            80% { transform: translate(6px, -6px) rotate(-1deg); }
            90% { transform: translate(-4px, 4px) rotate(0deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .animate-shake {
            animation: shake 0.3s infinite ease-in-out;
        }

        /* 文字自体の激しい揺れアニメーション */
        @keyframes textShake {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.08) rotate(-3deg); }
            50% { transform: scale(0.95) rotate(3deg); }
            75% { transform: scale(1.05) rotate(-2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animate-text-shake {
            animation: textShake 0.25s infinite ease-in-out;
        }

        /* テキスト袋文字（黒縁取り） */
        .text-stroke-black {
            -webkit-text-stroke: 4px #000;
            paint-order: stroke fill;
            font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
        }

        /* カードの青パルス発光エフェクト */
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); border-color: rgba(75, 85, 99, 1); }
            30% { box-shadow: 0 0 25px 8px rgba(59, 130, 246, 0.8); border-color: rgba(96, 165, 250, 1); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); border-color: rgba(75, 85, 99, 1); }
        }
        .card-pulse {
            animation: pulseGlow 0.4s ease-out;
        }

        /* 波紋アニメーション */
        @keyframes ripple {
            0% {
                width: 0px;
                height: 0px;
                opacity: 0.8;
            }
            100% {
                width: 1000px;
                height: 1000px;
                opacity: 0;
            }
        }
        .ripple-circle {
            position: absolute;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.9);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .ripple-1 { animation: ripple 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); animation-delay: 0s; }
        .ripple-2 { animation: ripple 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); animation-delay: 0.6s; }
        .ripple-3 { animation: ripple 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); animation-delay: 1.2s; }
    </style>
</head>
<body class="bg-black text-white overflow-hidden min-h-screen flex items-center justify-center m-0 p-0">

    <!-- 同階層にある sound.mp3 を指定 -->
    <audio id="sound" src="sound.mp3" preload="auto"></audio>

    <!-- 1. ローディング画面 -->
    <div id="loading-screen" class="fixed inset-0 bg-black flex flex-col items-center justify-center p-6 z-50 cursor-pointer">
        <!-- スピナー -->
        <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-8"></div>
        
        <!-- メインテキスト -->
        <h1 class="text-xl md:text-2xl font-bold mb-3 text-center text-gray-100">
            ローディング中…
        </h1>
        <p class="text-sm md:text-base text-gray-400 mb-8 animate-pulse text-center">
            （画面をタップしてください）
        </p>

        <!-- 偽のプログレスバー (97%固定) -->
        <div class="w-full max-w-md bg-gray-800 rounded-full h-3 overflow-hidden border border-gray-700">
            <div class="bg-blue-600 h-full rounded-full transition-all duration-300 ease-out" style="width: 97%;"></div>
        </div>
        <p class="text-xs text-gray-500 mt-2 font-mono">97% Completed</p>
    </div>

    <!-- 2. スピーカーテスト画面 -->
    <div id="test-screen" class="hidden fixed inset-0 bg-gray-950 flex flex-col items-center justify-center p-4 z-40">
        <!-- ダークグレーのカードUI -->
        <div id="test-card" class="w-full max-w-sm bg-gray-900 border-2 border-gray-700 rounded-2xl p-6 shadow-2xl flex flex-col items
